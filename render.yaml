services:
  - type: web
    name: bizmind
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn bizmind.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bizmind-db
          property: connectionString

databases:
  - name: bizmind-db
    plan: free
    region: singapore

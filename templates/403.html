{% extends "base.html" %}
{% block title %}Not allowed | BizMind{% endblock %}

{% block content %}
<div class="centered">
    <h1>You are not allowed to do that</h1>
    <p class="muted">Your account does not have permission for this action.</p>
    <div class="btn-row">
        {% if user.is_authenticated %}<a class="btn btn-primary" href="{% url 'dashboard:home' %}">Back to dashboard</a>{% else %}<a class="btn btn-primary" href="{% url 'core:home' %}">Back to home</a>{% endif %}
    </div>
</div>
{% endblock %}

{% load static %}

<header class="header">
    <nav class="navbar">
        <div class="bm-logo">
            <a href="{% url 'core:home' %}">BizMind</a>
        </div>

        <ul class="links">
            <li><a href="{% url 'core:home' %}">Home</a></li>
            <li><a href="{% url 'core:about' %}">About</a></li>
            <li><a href="{% url 'core:stats' %}">Stats</a></li>
            <li><a href="{% url 'core:contact' %}">Contact</a></li>
        </ul>

        <div class="actions">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard:home' %}" class="bm-btn primary">
                    Dashboard
                </a>
                <form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="bm-btn outline">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="bm-btn outline">
                    Login
                </a>
                <a href="{% url 'accounts:signup' %}" class="bm-btn primary">
                    Sign Up
                </a>
            {% endif %}
        </div>
    </nav>
</header>
